# ── Foco · reglas para Hyprland con el formato .conf ANTIGUO ────
# Úsalo solo si tu Hyprland todavía usa hyprland.conf (windowrulev2).
# En versiones actuales (configuración Lua) usa hyprland.lua.

windowrulev2 = float, title:^(Foco Widget)$
windowrulev2 = pin, title:^(Foco Widget)$
# Sin regla de tamaño: Foco lo fija según el ajuste "Tamaño del widget".
windowrulev2 = move 100%-w-20 56, title:^(Foco Widget)$
windowrulev2 = noinitialfocus, title:^(Foco Widget)$
windowrulev2 = nodim, title:^(Foco Widget)$
windowrulev2 = noborder, title:^(Foco Widget)$
windowrulev2 = rounding 18, title:^(Foco Widget)$

windowrulev2 = float, title:^(Foco)$
windowrulev2 = size 980 660, title:^(Foco)$
windowrulev2 = center, title:^(Foco)$

bind = SUPER, T, exec, foco --toggle
exec-once = foco --widget
