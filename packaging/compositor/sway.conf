# ── Foco · reglas para Sway / SwayFX ────────────────────────────
# Añade a ~/.config/sway/config
# Sin "resize set": Foco fija el tamaño según el ajuste "Tamaño del widget".
# Sway no admite expresiones, así que el hueco a la derecha depende del tamaño
# (340 px va bien con el tamaño 100 %; ajústalo si lo reduces).
for_window [title="^Foco Widget$"] floating enable, sticky enable, border none, move position 100 ppt 0 ppt, move left 340 px, move down 56 px
for_window [title="^Foco$"] floating enable, border none, resize set 980 660, move position center

# Solo SwayFX: vidrio y esquinas redondeadas (Sway normal no tiene blur;
# sube "Opacidad del vidrio" en Ajustes)
# for_window [title="^Foco"] blur enable, corner_radius 14

bindsym $mod+t exec foco --toggle
exec foco --widget
